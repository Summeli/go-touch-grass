<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>go-touch-grass options</title>
  <style>
    body { font: 14px sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
    small { color: #666; }
    button { margin-top: 20px; padding: 6px 16px; }
    #status { margin-left: 8px; color: #2a7; }
  </style>
</head>
<body>
  <h1>go-touch-grass</h1>
  <form id="form">
    <label for="apiKey">TypeSafe API key</label>
    <input id="apiKey" type="password" autocomplete="off" required>
    <small>Stored locally in this browser. Only the extension's background worker reads it.</small>

    <label for="selector">Post selector (CSS)</label>
    <input id="selector" type="text" required>
    <small>Matches the div that contains each post's text, e.g. <code>.message</code> on ylilauta.org.</small>

    <label for="threshold">Flag threshold (0–1)</label>
    <input id="threshold" type="number" min="0" max="1" step="0.05" required>
    <small>A post is flagged if Jev's probability for any category is at or above this value.</small>

    <button type="submit">Save</button><span id="status"></span>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
